# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus true, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Quick Look preview (sushi) - float as an overlay, don't steal focus.
# Size/position are forced by quicklook.sh since sushi ignores rule hints.
windowrule = float true, match:class ^(org.gnome.NautilusPreviewer)$
windowrule = no_focus true, match:class ^(org.gnome.NautilusPreviewer)$

# WAYBAR

# exec-once = waybar

# AGS
exec-once = ags run
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# macOS-style Mission Control (hyprexpo, our fork at
# ~/.config/ags/helpers/hyprexpo-fork — rebuild with `cmake --build build`
# and copy build/libhyprexpo.so to ~/.config/hypr/plugins/hyprexpo-fixed.so).
# Root cause of all 7 crashes on 2026-07-17: the upstream fork's hardcoded
# mangled symbol for shouldRenderWindow predated Hyprland moving CWindow
# into the Desktop::View namespace, so it matched nothing and a fuzzy
# name-fallback silently hooked the ONE-argument overload instead of the
# two-argument one — the hook then read its monitor argument from a
# register the callers never set, corrupting/crashing on a garbage
# smart-pointer refcount increment. Fixed in Hooks.cpp: exact 0.55.4
# symbol + an arity-checked fallback that fails plugin load loudly rather
# than ever binding the wrong overload. (Also fixed: a stale live-preview
# global in LivePreview.cpp, see comment there.) Loaded via hyprctl, NOT
# hyprpm — hyprpm only has the broken upstream build.
exec-once = hyprctl plugin load ~/.config/hypr/plugins/hyprexpo-fixed.so

plugin {
    hyprexpo {
        # columns sets BOTH grid dimensions (always columns×columns) —
        # 3 gives a 3x3=9-slot grid, right for ~6 workspaces
        columns = 3
        gap_size = 12
        gap_size_outer = 24
        bg_col = rgb(1c1c1e)
        workspace_method = center current
        preview_mode = cached
        content_mode = workspaces
        skip_empty = true
        show_workspace_numbers = true
        workspace_number_color = rgb(ebebf0)
        tile_rounding = 14
        border_width = 2
        border_color_current = rgb(64a5f5)
        border_color_hover = rgb(7eb0ef)
        window_icon_enable = true
        window_icon_position = bottom-right
        window_icon_size = 28
        cancel_key = escape
    }
}

# Wallpaper
exec-once = swaybg -i ~/Pictures/wallpapers/wallpaper.png -m fill


# windowrulev2 = blur, class:waybar

# macOS-style OSD layer (AGS): frosted glass + compositor fade in/out
layerrule = blur true, match:namespace osd
layerrule = ignore_alpha 0.3, match:namespace osd
layerrule = animation fade, match:namespace osd

# Group-switch toast (AGS): frosted glass + compositor fade in/out
layerrule = blur true, match:namespace group-toast
layerrule = ignore_alpha 0.3, match:namespace group-toast
layerrule = animation fade, match:namespace group-toast

# macOS-style menu bar + popovers (AGS): frosted glass
layerrule = blur true, match:namespace ^(bar)$
layerrule = ignore_alpha 0.2, match:namespace ^(bar)$
layerrule = blur true, match:namespace ^(popover-.*)$
layerrule = ignore_alpha 0.4, match:namespace ^(popover-.*)$

# Raycast-style app launcher (AGS): frosted glass behind the panel
layerrule = blur true, match:namespace ^(launcher)$
layerrule = ignore_alpha 0.4, match:namespace ^(launcher)$
layerrule = animation fade, match:namespace ^(launcher)$
layerrule = animation fade, match:namespace ^(popover-.*)$

# macOS-style Mission Control (AGS): frosted, darkened desktop-overview scrim
layerrule = blur true, match:namespace ^(mission-control)$
layerrule = ignore_alpha 0.2, match:namespace ^(mission-control)$
layerrule = animation fade, match:namespace ^(mission-control)$

exec-once = hyprctl setcursor macOS 24

# Fusuma (Gestures)
exec-once = fusuma -d

# windowrulev2 = float, class:^(zen)$
