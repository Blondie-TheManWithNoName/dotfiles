# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 0

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

render {
    # Hand a fullscreen window's buffer straight to the display controller,
    # skipping compositing — the win for a fullscreen movie on the TV.
    # Only engages when that window is alone and unobscured on its output.
    # Set back to 0 if you see flicker or black frames.
    direct_scanout = 1
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 15
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 8
        passes = 4
        vibrancy = 0.1696
        contrast = 1.0
        brightness = 1.0
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInQuad,0.11,0,0.5,0
    bezier = easeOutCubic,0.33,1,0.68,1
    bezier = easeInCubic,0.32,0,0.67,0
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = easeInOutQuint,0.83,0,0.17,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = ease, 0.25, 0.1, 0.25, 1.0

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, easeInOutQuint, fade
    #animation = workspacesIn, 1, 2, easeInOutQuint, fade
    #animation = workspacesOut, 1, 2, easeInOutQuint, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile option was removed in Hyprland 0.55
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = altwin:swap_lalt_lwin # Mac order: key next to space = Super (Command), old Win key = Alt (Option)
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.6 # tame jumpy/twitchy 2-finger scroll steps
    }
}

# Force an explicit reset back to the pre-session default (adaptive accel,
# neutral sensitivity) — a plain `hyprctl reload` doesn't reliably undo a
# previously-applied accel_profile, it seems to stick until re-set.
device {
    name = asue120b:00-04f3:31c0-touchpad
    sensitivity = 0.15
    accel_profile = adaptive
}

# Gestures: Hyprland 0.55 replaced gestures:workspace_swipe with a new
# `gesture =` keyword system. We deliberately define NO gestures here —
# fusuma (see ~/.config/fusuma/config.yml) owns all 3-finger swipes, so
# switching stays a discrete threshold-based flick rather than Hyprland's
# native live 1:1 drag-follow.

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
 #bind = , mouse:274, exec, 
bindn = , mouse:274, exec, wl-copy -pc
$mainMod = SUPER # Command key — physically the key next to the spacebar (Alt/Win swapped via input:kb_options)

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, killactive,      # Cmd+Q → close the focused window
bind = $mainMod, Return, exec, $terminal # Cmd+Return → open terminal (moved from Cmd+Q)
# bind = $mainMod, C, killactive, # disabled: Cmd+C is now copy (Super+W still quits the focused app)
bind = $mainMod, W, exec, ~/scripts/browser-key.sh CTRL W $kill # Cmd+W → close tab in Chrome/Zen, else quit whole app
# bind = $mainMod, M, exit,
bind = $mainMod, T, exec, ~/scripts/browser-key.sh CTRL T alacritty -e gotop # Cmd+T → new tab in Chrome/Zen, else gotop
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, ~/scripts/browser-key.sh CTRL F bash -c "hyprctl dispatch togglefloating && ags request 'barToggle'" # Cmd+F → find-in-page in Chrome/Zen, else toggle floating
bind = $mainMod, S, exec, ~/scripts/browser-key.sh CTRL S hyprctl dispatch pin # Cmd+S → save page in Chrome/Zen, else pin window
bind = $mainMod, SPACE, exec, $menu # macOS-style Cmd+Space launcher
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle (0.55: togglesplit moved under layoutmsg)
# bind = $mainMod, V, togglefloating # disabled: Cmd+V is now paste (Super+F still toggles floating)

# ── macOS-style Command shortcuts ─────────────────────────────
# Cmd = the key next to the spacebar. These translate Cmd+key to the
# Linux equivalent in the focused app. Copy/paste use Ctrl+Insert /
# Shift+Insert so Cmd+C in a terminal doesn't interrupt the running
# program (kitty.conf maps these to clipboard copy/paste).
# NOTE: the trailing comma (empty window arg = active window) is required —
# without it sendshortcut fails with "invalid args" on Hyprland 0.49.
bind = $mainMod, C, sendshortcut, CTRL, Insert, activewindow    # Cmd+C → copy
bind = $mainMod, V, sendshortcut, SHIFT, Insert, activewindow   # Cmd+V → paste
bind = $mainMod, X, sendshortcut, CTRL, X, activewindow         # Cmd+X → cut
binde = $mainMod, Z, sendshortcut, CTRL, Z, activewindow        # Cmd+Z → undo
bind = $mainMod SHIFT, Z, sendshortcut, CTRL SHIFT, Z, activewindow             # Cmd+Shift+Z → redo
bind = $mainMod, A, sendshortcut, CTRL, A, activewindow         # Cmd+A → select all
bind = $mainMod, N, sendshortcut, CTRL, N, activewindow         # Cmd+N → new window

# Cmd+Tab / Cmd+Shift+Tab → window switcher (macOS app switcher)
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, alterzorder, top
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, alterzorder, top

# Move focus with Cmd+Option + arrow keys (plain Cmd+arrows = Mac text navigation)
bind = $mainMod ALT, left, movefocus, l
bind = $mainMod ALT, right, movefocus, r
bind = $mainMod ALT, up, movefocus, u
bind = $mainMod ALT, down, movefocus, d

# Ctrl + ←/→ → previous/next workspace (macOS Spaces switching)
bind = CTRL, left, workspace, e-1
bind = CTRL, right, workspace, e+1

# Switch desktops with Option (Alt) + [0-9] — frees Cmd+num for in-app tabs
# like macOS. N is relative to whichever desktop GROUP is currently active
# (see widget/Workspaces.tsx) — desktop 1 is a different real Hyprland
# workspace in "programming" vs "design" — so this asks AGS to resolve it,
# rather than dispatching a fixed workspace number directly.
bind = ALT, 1, exec, ags request "desktop 1"
bind = ALT, 2, exec, ags request "desktop 2"
bind = ALT, 3, exec, ags request "desktop 3"
bind = ALT, 4, exec, ags request "desktop 4"
bind = ALT, 5, exec, ags request "desktop 5"
bind = ALT, 6, exec, ags request "desktop 6"
bind = ALT, 7, exec, ags request "desktop 7"
bind = ALT, 8, exec, ags request "desktop 8"
bind = ALT, 9, exec, ags request "desktop 9"
bind = ALT, 0, exec, ags request "desktop 10"

# Move active window to a desktop with Option (Alt) + SHIFT + [0-9] — same
# active-group-relative resolution as above
bind = ALT SHIFT, 1, exec, ags request "moveToDesktop 1"
bind = ALT SHIFT, 2, exec, ags request "moveToDesktop 2"
bind = ALT SHIFT, 3, exec, ags request "moveToDesktop 3"
bind = ALT SHIFT, 4, exec, ags request "moveToDesktop 4"
bind = ALT SHIFT, 5, exec, ags request "moveToDesktop 5"
bind = ALT SHIFT, 6, exec, ags request "moveToDesktop 6"
bind = ALT SHIFT, 7, exec, ags request "moveToDesktop 7"
bind = ALT SHIFT, 8, exec, ags request "moveToDesktop 8"
bind = ALT SHIFT, 9, exec, ags request "moveToDesktop 9"
bind = ALT SHIFT, 0, exec, ags request "moveToDesktop 10"

# Cmd + [1-9] → switch tab N in the focused app (sent as Ctrl+num),
# Cmd + 0 → reset zoom — like macOS
bind = $mainMod, 1, sendshortcut, CTRL, 1, activewindow
bind = $mainMod, 2, sendshortcut, CTRL, 2, activewindow
bind = $mainMod, 3, sendshortcut, CTRL, 3, activewindow
bind = $mainMod, 4, sendshortcut, CTRL, 4, activewindow
bind = $mainMod, 5, sendshortcut, CTRL, 5, activewindow
bind = $mainMod, 6, sendshortcut, CTRL, 6, activewindow
bind = $mainMod, 7, sendshortcut, CTRL, 7, activewindow
bind = $mainMod, 8, sendshortcut, CTRL, 8, activewindow
bind = $mainMod, 9, sendshortcut, CTRL, 9, activewindow
bind = $mainMod, 0, sendshortcut, CTRL, 0, activewindow

# ── Mac-style browser shortcuts (Chrome/Zen) ───────────────────
# These keys are free everywhere else, so they're sent globally.
# T/W/F/S are handled above via browser-key.sh since those keys
# already do something else outside the browser.
bind = $mainMod, R, sendshortcut, CTRL, R, activewindow         # Cmd+R → reload
bind = $mainMod SHIFT, R, sendshortcut, CTRL SHIFT, R, activewindow             # Cmd+Shift+R → hard reload
bind = $mainMod, L, sendshortcut, CTRL, L, activewindow         # Cmd+L → focus address bar
bind = $mainMod, D, sendshortcut, CTRL, D, activewindow         # Cmd+D → bookmark page
bind = $mainMod SHIFT, T, sendshortcut, CTRL SHIFT, T, activewindow             # Cmd+Shift+T → reopen closed tab
bind = $mainMod SHIFT, N, sendshortcut, CTRL SHIFT, N, activewindow             # Cmd+Shift+N → new incognito window
bind = $mainMod, bracketleft, sendshortcut, ALT, Left, activewindow             # Cmd+[ → back
bind = $mainMod, bracketright, sendshortcut, ALT, Right, activewindow           # Cmd+] → forward

# ── Mac-style text editing ────────────────────────────────────
# binde = repeats while held
binde = $mainMod, BackSpace, sendshortcut, CTRL, BackSpace, activewindow        # Cmd+Backspace → delete previous word
binde = ALT, BackSpace, sendshortcut, CTRL, BackSpace, activewindow             # Option+Backspace → delete previous word (real Mac combo)
binde = ALT, Left, sendshortcut, CTRL, Left, activewindow       # Option+←/→ → jump by word
binde = ALT, Right, sendshortcut, CTRL, Right, activewindow
binde = ALT SHIFT, Left, sendshortcut, CTRL SHIFT, Left, activewindow           # Option+Shift+←/→ → select by word
binde = ALT SHIFT, Right, sendshortcut, CTRL SHIFT, Right, activewindow
binde = ALT, Tab, sendshortcut, CTRL, Tab, activewindow         # Option+Tab → next tab (Fn can't be bound — firmware)
binde = ALT SHIFT, Tab, sendshortcut, CTRL SHIFT, Tab, activewindow             # Option+Shift+Tab → previous tab
binde = $mainMod, Left, sendshortcut, , Home, activewindow      # Cmd+←/→ → line start/end
binde = $mainMod, Right, sendshortcut, , End, activewindow
binde = $mainMod, Up, sendshortcut, CTRL, Home, activewindow    # Cmd+↑/↓ → document top/bottom
binde = $mainMod, Down, sendshortcut, CTRL, End, activewindow
binde = $mainMod SHIFT, Left, sendshortcut, SHIFT, Home, activewindow           # + Shift → select to line/document ends
binde = $mainMod SHIFT, Right, sendshortcut, SHIFT, End, activewindow
binde = $mainMod SHIFT, Up, sendshortcut, CTRL SHIFT, Home, activewindow
binde = $mainMod SHIFT, Down, sendshortcut, CTRL SHIFT, End, activewindow

# Example special workspace (scratchpad)
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
# Drag windows with Option (Alt) — frees Cmd+click for opening links in new tabs
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# Rotate Screen
# Rotate eDP-1 to normal
bind = $mainMod, F1, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.666667,transform,0

# Rotate eDP-1 to 90° (right)
bind = $mainMod, F2, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.666667,transform,1


bind = $mainMod, F3, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.666667,transform,3

# Laptop multimedia keys for volume and LCD brightness
# Media keys go through osd.sh: applies the change + flashes the macOS-style OSD
bindel = ,XF86AudioRaiseVolume, exec, ~/scripts/osd.sh volume-up
bindel = ,XF86AudioLowerVolume, exec, ~/scripts/osd.sh volume-down
bindel = ,XF86AudioMute, exec, ~/scripts/osd.sh volume-mute
bindel = ,XF86AudioMicMute, exec, ~/scripts/osd.sh mic-mute
bindel = ,XF86MonBrightnessUp, exec, ~/scripts/osd.sh bright-up
bindel = ,XF86MonBrightnessDown, exec, ~/scripts/osd.sh bright-down
bindel = ,XF86KbdBrightnessUp, exec, ~/scripts/osd.sh kbd-up
bindel = ,XF86KbdBrightnessDown, exec, ~/scripts/osd.sh kbd-down
bindl = ,XF86KbdLightOnOff, exec, ~/scripts/osd.sh kbd-cycle # F7 on ASUS emits this single "cycle" key
bindl = , XF86TouchpadToggle, exec, ~/scripts/osd.sh night-cycle # F6: blue-light filter levels + OSD

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# screenshot 
bind = , Print, exec, if area=$(slurp); then grim -g "$area" - | tee >(wl-copy) > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png && dunstify "Screenshot of the region taken" -t 1000; fi 
bind = SHIFT, Print, exec, grim - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | dunstify "Screenshot of whole screen taken" -t 1000 # screenshot of the whole screen

