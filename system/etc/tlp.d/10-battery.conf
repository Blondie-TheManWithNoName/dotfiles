# --- Battery longevity: stop charging at 80% ---
# Temporarily override before a trip with: sudo tlp fullcharge
STOP_CHARGE_THRESH_BAT0=80

# --- ACPI platform profile: quiet on battery ---
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=quiet

# --- CPU (amd-pstate-epp): prefer efficiency on battery ---
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Turbo boost off on battery: the 6800H boosts to 4.7 GHz at poor perf/watt
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- Panel adaptive backlight (applied only if the panel supports it) ---
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# --- PCIe link power management ---
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# --- Wi-Fi powersave (MediaTek MT7922) ---
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
